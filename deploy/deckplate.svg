<?xml version="1.0" encoding="UTF-8"?>
<!--
<summary>Deckplate application icon: the deck as the page draws it, a dark
plate with three rows of five keys and the display strip down the right.</summary>
<remarks>Installed under ~/.local/share/icons/hicolor/scalable/apps by
deploy/install-desktop.sh. Colours are the page's card, key and signal blue
from deckplate/web/app.css.</remarks>
-->
