  <rect x="2" y="14" width="60" height="36" rx="6" fill="#1b242e" stroke="#5c9bde" stroke-width="2"/>
  <g fill="#2c3a48">
    <rect x="8" y="21" width="6" height="6" rx="1"/><rect x="16" y="21" width="6" height="6" rx="1"/>
    <rect x="24" y="21" width="6" height="6" rx="1"/><rect x="32" y="21" width="6" height="6" rx="1"/>
    <rect x="40" y="21" width="6" height="6" rx="1"/>
    <rect x="8" y="29" width="6" height="6" rx="1"/><rect x="16" y="29" width="6" height="6" rx="1"/>
    <rect x="24" y="29" width="6" height="6" rx="1"/><rect x="32" y="29" width="6" height="6" rx="1"/>
    <rect x="40" y="29" width="6" height="6" rx="1"/>
    <rect x="8" y="37" width="6" height="6" rx="1"/><rect x="16" y="37" width="6" height="6" rx="1"/>
